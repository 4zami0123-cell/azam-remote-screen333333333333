name: Build Azam Share

on:
  push:
  workflow_dispatch:

jobs:
  iphone:
    name: iPhone app (.ipa)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project AzamShare.xcodeproj -target AzamShare -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Release-iphoneos/AzamShare.app Payload/
          zip -qry AzamShare.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AzamShare-iPhone
          path: ios/AzamShare.ipa

  windows:
    name: Windows app (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        working-directory: pc
        run: |
          python -m pip install -r requirements.txt
          python -m PyInstaller --noconfirm --onefile --windowed --name "Azam Share" --icon icon.ico --add-data "icon.ico;." azam_share.py
      - uses: actions/upload-artifact@v4
        with:
          name: AzamShare-Windows
          path: pc/dist/Azam Share.exe
